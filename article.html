<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>專欄｜蘇昊數理</title>
<meta name="description" content="蘇昊數理專欄">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#fbfbf9">
<meta property="og:type" content="article">
<meta property="og:site_name" content="蘇昊數理">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.progress{position:fixed;left:0;top:0;height:2px;background:var(--fg);width:0;z-index:60}
article{max-width:720px;margin:0 auto;padding:calc(140px + env(safe-area-inset-top)) 24px 80px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:11px;letter-spacing:.22em;color:var(--sub)}
.meta a:hover{color:var(--fg)}
h1.title{font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,58px);line-height:1.3;letter-spacing:.05em;margin:18px 0 22px}
.lede{font-family:var(--serif);font-size:19px;color:#555;line-height:1.9;border-left:1px solid var(--fg);padding-left:18px}
.cover{margin:48px -24px 0;aspect-ratio:16/9;background:#eceae4 center/cover no-repeat}
@media (min-width:900px){.cover{margin:56px -120px 0}}
.body{font-family:var(--serif);font-size:18px;line-height:2.05;letter-spacing:.03em;margin-top:52px;color:#1e1e1e}
.body > *+*{margin-top:1.15em}
.body h2{font-weight:500;font-size:26px;letter-spacing:.06em;margin-top:2.2em;line-height:1.5}
.body h3{font-weight:500;font-size:21px;margin-top:1.8em}
.body a{border-bottom:1px solid currentColor}
.body strong{font-weight:700}
.body blockquote{border-left:1px solid var(--fg);padding:2px 0 2px 20px;color:#555}
.body ul,.body ol{padding-left:1.4em}
.body li+li{margin-top:.4em}
.body img{max-width:100%;display:block;margin:2em auto}
.body figure figcaption,.body img + em{display:block;text-align:center;font-size:13px;color:var(--sub);font-style:normal}
.body hr{border:0;text-align:center;margin:2.4em 0}
.body hr::before{content:"＊　＊　＊";color:var(--sub);letter-spacing:.4em}
.body code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:#efede8;padding:.1em .35em}
.body pre{background:#141414;color:#eee;padding:18px 20px;overflow:auto;font-size:14px;line-height:1.7}
.body pre code{background:none;padding:0}
.body table{border-collapse:collapse;width:100%;font-size:15px;font-family:var(--sans)}
.body th,.body td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.body .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
.end{margin-top:70px;padding-top:30px;border-top:1px solid var(--fg);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.end .who{display:flex;align-items:center;gap:18px}
.end .who .logo{flex:none;font-size:18px}
.end .who b{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.1em;display:block}
.end .who span{font-size:12px;color:var(--sub)}
.share{font-size:12px;letter-spacing:.2em;border-bottom:1px solid var(--fg);padding-bottom:2px}
.next{border-top:1px solid var(--line);margin-top:70px}
.next a{display:block;padding:26px 0;border-bottom:1px solid var(--line)}
.next a span{font-size:11px;letter-spacing:.2em;color:var(--sub)}
.next a b{display:block;font-family:var(--serif);font-weight:300;font-size:22px;letter-spacing:.05em;margin-top:4px}
.cta{margin-top:60px;background:var(--wall);padding:34px 30px;text-align:center}
.cta p{font-family:var(--serif);font-size:20px;letter-spacing:.08em;margin-bottom:18px}
.state{padding:40vh 24px;text-align:center;font-family:var(--serif);color:var(--sub);font-size:20px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<nav class="nav"><div class="wrap">
  <a class="brand" href="./" aria-label="蘇昊數理 首頁"><span class="logo sm" data-text="蘇昊數理"></span></a>
  <div class="links"><a href="./#room1">作品</a><a href="articles.html">專欄</a><a href="./#visit">參觀資訊</a></div>
  <a class="pill" href="https://line.me/ti/p/~@000gwomo" target="_blank" rel="noopener">預約試教</a>
</div></nav>

<div id="root"><div class="state">翻頁中…</div></div>

<footer class="site"><div class="wrap">
  <div class="row"><a href="./">首頁</a><a href="articles.html">所有專欄</a><a href="https://line.me/ti/p/~@000gwomo" target="_blank" rel="noopener">官方 LINE</a><a href="mailto:suuuuuhaooooo@gmail.com">Email</a></div>
  © 2026 蘇昊數理 SUHAO MATH &amp; SCIENCE
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/logo.js"></script>
<script src="assets/protect.js"></script>
<script src="assets/render.js"></script>
<script>
(async function () {
  const C = window.SUHAO, root = document.getElementById('root');
  const slug = new URLSearchParams(location.search).get('s');
  const fail = t => root.innerHTML = `<div class="state">${t}<br><br><a class="btn" href="articles.html">回閱覽室</a></div>`;
  if (!slug) return fail('找不到這篇文章。');
  let a = null;
  try { if (C.sb) { const r = await C.sb.from('articles').select('*').eq('slug', slug).maybeSingle(); a = r.data; } } catch (_) {}
  if (!a && C.demo) a = C.DEMO.find(x => x.slug === slug) && Object.assign({ published: true }, C.DEMO.find(x => x.slug === slug));
  if (!a) return fail('找不到這篇文章。');

  document.title = a.title + '｜蘇昊數理';
  const setMeta = (sel, attr, v) => { let m = document.querySelector(sel); if (!m) { m = document.createElement('meta'); m.setAttribute(attr.split('=')[0], attr.split('=')[1]); document.head.appendChild(m); } m.content = v; };
  setMeta('meta[name="description"]', 'name=description', a.excerpt || a.title);
  setMeta('meta[property="og:title"]', 'property=og:title', a.title);
  setMeta('meta[property="og:description"]', 'property=og:description', a.excerpt || '');
  if (a.cover_url) setMeta('meta[property="og:image"]', 'property=og:image', a.cover_url);

  const tags = (a.tags || []).map(t => `<a href="articles.html?tag=${encodeURIComponent(t)}">${C.esc(t)}</a>`).join('');
  const mins = Math.max(1, Math.round((a.body || '').length / 500));
  root.innerHTML = `<article>
    <div class="meta"><span>${C.date(a.published_at)}</span>${tags}<span>約 ${mins} 分鐘</span>${a.published ? '' : '<span style="color:#b3261e">草稿（只有你看得到）</span>'}</div>
    <h1 class="title">${C.esc(a.title)}</h1>
    ${a.excerpt ? `<p class="lede">${C.esc(a.excerpt)}</p>` : ''}
    ${a.cover_url ? `<div class="cover" style="background-image:url('${C.esc(a.cover_url)}')"></div>` : ''}
    <div class="body" id="body"></div>
    <div class="end">
      <div class="who"><span class="logo sm" data-text="蘇昊數理"></span><div><b>蘇昊</b><span>數學・理化家教</span></div></div>
      <button class="share" id="share">複製文章連結</button>
    </div>
    <div class="cta"><p>想讓孩子這樣學數理？</p><a class="btn solid" href="${C.LINE}" target="_blank" rel="noopener">傳 LINE 預約試教</a></div>
    <div class="next" id="next"></div>
  </article>`;
  window.renderArticle(document.getElementById('body'), a.body || '');
  document.querySelectorAll('.logo[data-text]').forEach(el => window.suhaoLogo && window.suhaoLogo(el));

  document.getElementById('share').onclick = async e => {
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = '已複製'; }
    catch (_) { e.target.textContent = location.href; }
  };
  try {
    const more = (await C.listArticles(6)).filter(x => x.slug !== a.slug).slice(0, 3);
    if (more.length) document.getElementById('next').innerHTML = '<span class="label" style="display:block;padding-top:26px">繼續閱讀</span>' +
      more.map(x => `<a href="${C.articleUrl(x.slug)}"><span>${C.date(x.published_at)}</span><b>${C.esc(x.title)}</b></a>`).join('');
  } catch (_) {}

  const prog = document.getElementById('prog');
  addEventListener('scroll', () => { const h = document.documentElement; prog.style.width = (h.scrollTop / (h.scrollHeight - innerHeight) * 100) + '%'; }, { passive: true });
})();
</script>
</body>
</html>
